# 商城用户端 SPA 的 nginx 配置。
#
# 覆盖 nginx:alpine 自带的 /etc/nginx/conf.d/default.conf。
#
# 这里只做静态托管，**不反代后端**：前端 request.ts 的 baseURL 是绝对地址
# http://localhost:53000/api，由浏览器直接打网关，不经过这个 nginx。
# 所以既没有 proxy_pass，也不存在这里要处理的跨域问题
# （跨域在网关的 CorsConfiguration 里放行，白名单里已经有 http://localhost:56732）。

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # vue-router 用的是 history 模式（createWebHistory），URL 里没有 #。
    # 直接访问或刷新 /order、/checkout、/pay/xxx 这类深链接时，nginx 会把它当成
    # "找这个文件"，找不到就 404 —— 而这些路由只存在于前端，服务器上根本没有对应文件。
    # try_files 依次尝试：真实文件 → 目录 → 回落到 index.html 交给 vue-router 解析。
    #
    # ⚠️ 这一条是 SPA 容器的关键。少了它的表现是"从首页一层层点进去都正常，
    #    但只要在深链接上按 F5 就 404"，很容易被误判成路由写错了。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 本身绝对不能被缓存：它引用的 assets/*.js、*.css 文件名带内容 hash，
    # 内容一变文件名就变。但 index.html 被缓存住的话，用户会一直加载上一版的资源清单，
    # 表现为"明明部署了新版本，页面却没变"。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # assets/ 下的文件名都带内容 hash，可以放心长缓存。
    # 用 location /assets/ 精确圈定范围，不会影响上面的 index.html 规则。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 前端产物最大的两个 chunk 都是 JS，gzip 大致能压到三分之一
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/wasm;
}
